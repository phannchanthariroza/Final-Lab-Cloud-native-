apiVersion: v1
kind: Service
metadata:
  name: student-gateway
spec:
  type: NodePort
  selector: { app: student-core }
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: student-search
spec:
  selector: { app: student-search }
  ports:
    - port: 5002
      targetPort: 5002
